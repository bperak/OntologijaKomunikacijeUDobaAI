# META-UPUTE — sve upute zapisane tako da se mogu provjeriti
# Provjera: python3 kod/check_meta.py   (pokreće svaku `provjera` i traži `ocekivano`)
# Čovjeku čitljiv pregled generira se u docs/META-UPUTE.md — ne uređivati ručno.
# Vrste: stil · sadržaj · čitatelj · pojmovi · povezanost · tvrdnje · proces

meta:
  verzija: "1.0"
  datum: "2026-10-03"
